[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
curl-fx = { path = "crates/curl-fx" }
curl-sim = { path = "crates/curl-sim" }
curl-proto = { path = "crates/curl-proto" }
curl-rules = { path = "crates/curl-rules" }

[profile.release]
lto = "thin"
overflow-checks = true

