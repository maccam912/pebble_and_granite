[package]
name = "curl-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
name = "pebble_iroh"
crate-type = ["cdylib"]
[dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread"] }
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
godot = { version = "=0.5.5", features = ["api-4-5"] }
anyhow = "1.0.104"
bytes = "1.12.1"
base64 = "0.23.1"
[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"
